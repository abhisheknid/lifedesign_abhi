<title>Life Design for Abhi</title>
<style>
:root{color-scheme:light;--paper:#FFFFFF;--card:#FFFFFF;--ink:#1D1B18;--ink-3:#7A7468;--line:#E0D7C4;--teal:#0E6B63;--crit:#c0322f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--paper:#15130F;--card:#211E18;--ink:#F3EEE4;--ink-3:#9A9283;--line:#342F26;--teal:#4FC0B3;--crit:#f07370}}
:root[data-theme="dark"]{color-scheme:dark;--paper:#15130F;--card:#211E18;--ink:#F3EEE4;--ink-3:#9A9283;--line:#342F26;--teal:#4FC0B3;--crit:#f07370}
*{box-sizing:border-box}
body.gate{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:17px/1.5 "Gilroy","Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.gate form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 12px 40px -20px rgba(0,0,0,.35)}
.gate h1{font:800 30px/1.15 "Gilroy","Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 6px}
.gate h1 span{color:var(--teal)}
.gate p{margin:0 0 20px;color:var(--ink-3);font-size:16px}
.gate input[type=password]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.gate input[type=password]:focus{outline:2px solid var(--teal);outline-offset:1px}
.gate label.r{display:flex;gap:8px;align-items:center;font-size:16px;color:var(--ink-3);margin:12px 0 18px}
.gate button{width:100%;font:600 15px inherit;padding:12px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);cursor:pointer}
.gate button[disabled]{opacity:.6}
.gate .err{color:var(--crit);font-size:16px;min-height:21px;margin-top:10px}
</style>
</head>

</form>

(async function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const KEY = 'ld-abhi-key';
  async function decryptWith(key){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
    return new TextDecoder().decode(pt);
  }
  // Swap in the unlocked page by replacing <head> and <body> (document.open/write is unreliable in Chrome
  // when it runs before the gate finishes parsing), then run its scripts in order.
  function show(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const root = document.documentElement;
    [...root.attributes].forEach(a => root.removeAttribute(a.name));
    [...doc.documentElement.attributes].forEach(a => root.setAttribute(a.name, a.value));
    document.head.replaceWith(document.importNode(doc.head, true));
    document.body.replaceWith(document.importNode(doc.body, true));
    document.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }
  async function fromStored(){
    let raw = null;
    try { raw = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch(e) {}
    if (!raw) return false;
    try {
      const k = await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']);
      show(await decryptWith(k)); return true;
    } catch(e) { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch(_) {} return false; }
  }
  if (await fromStored()) return;
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Unlocking…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
      const html = await decryptWith(key);
      const raw = enc(await crypto.subtle.exportKey('raw', key));
      try { (document.getElementById('rem').checked ? localStorage : sessionStorage).setItem(KEY, raw); } catch(_) {}
      show(html);
    } catch(ex) {
      err.textContent = 'That password did not work. Try again.';
      go.disabled = false; go.textContent = 'Unlock';
    }
  });
})();
